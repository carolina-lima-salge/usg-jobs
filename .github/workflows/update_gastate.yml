name: Update GA State Jobs

on:
  # Run every day at 9 AM ET (2 PM UTC)
  schedule:
    - cron: '0 14 * * *'

  # Allow manual trigger from the GitHub Actions tab
  workflow_dispatch:

jobs:
  scrape-gastate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests beautifulsoup4 lxml playwright

      - name: Install Playwright Chromium
        run: python -m playwright install chromium --with-deps

      - name: Run GA State scraper
        working-directory: scrapers
        run: python scraper_gastate.py
        continue-on-error: true

      - name: Upload debug HTML sample (if captured)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: faculty-detail-debug-html
          path: scrapers/debug_faculty_detail_sample.html
          if-no-files-found: ignore

      - name: Commit gastate_jobs.csv
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scrapers/gastate_jobs.csv
          if git diff --cached --quiet; then
            echo "No changes to gastate_jobs.csv — skipping commit."
          else
            COUNT=$(python3 -c "import csv; print(sum(1 for _ in csv.DictReader(open('scrapers/gastate_jobs.csv'))))" 2>/dev/null || echo "?")
            git commit -m "Update GA State jobs data: ${COUNT} listings [skip ci]"
            git fetch origin main
            git merge -X ours origin/main --no-edit
            git push
          fi
