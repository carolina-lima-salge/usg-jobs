name: Update UGA Jobs

on:
  # Run every day at 7 AM ET (12 PM UTC)
  schedule:
    - cron: '0 12 * * *'

  # Allow manual trigger from the GitHub Actions tab
  workflow_dispatch:

jobs:
  scrape-uga:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests beautifulsoup4 lxml

      - name: Run UGA scraper
        working-directory: scrapers
        run: python scraper.py
        continue-on-error: true

      - name: Commit uga_jobs.csv
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scrapers/uga_jobs.csv
          if git diff --cached --quiet; then
            echo "No changes to uga_jobs.csv — skipping commit."
          else
            COUNT=$(python3 -c "import csv; print(sum(1 for _ in csv.DictReader(open('scrapers/uga_jobs.csv'))))" 2>/dev/null || echo "?")
            git commit -m "Update UGA jobs data: ${COUNT} listings [skip ci]"
            git fetch origin main
            git merge -X ours origin/main --no-edit
            git push
          fi
