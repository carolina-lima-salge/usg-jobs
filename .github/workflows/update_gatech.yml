name: Update GA Tech Jobs

on:
  # Run every day at 8 AM ET (1 PM UTC)
  schedule:
    - cron: '0 13 * * *'

  # Allow manual trigger from the GitHub Actions tab
  workflow_dispatch:

jobs:
  scrape-gatech:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests beautifulsoup4 lxml playwright

      - name: Install Playwright Chromium
        run: python -m playwright install chromium --with-deps

      - name: Run GA Tech scraper
        working-directory: scrapers
        run: python scraper_gatech.py
        continue-on-error: true

      - name: Commit gatech_jobs.csv
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scrapers/gatech_jobs.csv
          if git diff --cached --quiet; then
            echo "No changes to gatech_jobs.csv — skipping commit."
          else
            COUNT=$(python3 -c "import csv; print(sum(1 for _ in csv.DictReader(open('scrapers/gatech_jobs.csv'))))" 2>/dev/null || echo "?")
            git commit -m "Update GA Tech jobs data: ${COUNT} listings [skip ci]"
            git fetch origin main
            git merge -X ours origin/main --no-edit
            git push
          fi
